<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Iceberg</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="signal-card">
      <p class="label">Magic Penguin welcomes you to</p>
      <h1>The Iceberg</h1>

      <p class="message">
        Find your place, this is a sanctuary for all.
      </p>

      <p id="dome-status" class="status">Neptune status: On Standby</p>
      <button id="myButton">Confirm Arrival</button>

<p id="message"></p>


      <section class="crew-note" aria-labelledby="crew-note-title">
        <h2 id="crew-note-title">Assist Others Along The Way</h2>
        <p>Strength in numbers, my brother. Assist thy fellow comrade.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
